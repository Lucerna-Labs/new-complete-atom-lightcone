[workspace]
resolver = "3"
members = [
    "crates/lightcone-core",
    "crates/lightcone-cli",
    "crates/lightcone-adapter",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
